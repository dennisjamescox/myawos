# MyAWOS SDR Configuration
# Copy this file to the deployment directory and customize it. Automatic RF
# transmission remains disabled until the operator explicitly enables it.

station:
  identifier: "YOUR-AIRPORT"
  latitude: 0.0
  longitude: 0.0

weather:
  type: "weatherlink_live"
  # Reserve the WeatherLink Live address in DHCP and enter it here or export
  # MYAWOS_WEATHERLINK_HOST. The optional discovery library is not required.
  host: "192.0.2.10"
  port: 80
  max_age_hours: 12

radio:
  frequency_mhz: "122.700000"
  # 122.700 remains the click detector and primary archived channel.
  # Auxiliary channels are archived only through the owned-aircraft gate below.
  live_monitor_frequencies_mhz:
    - "122.700000"
    - "122.800000"
    - "121.500000"
    - "122.900000"
    - "122.750000"
    - "123.025000"
  required_clicks: 5
  click_window_seconds: 4.0
  cooldown_seconds: 30

sdr:
  device: "hackrf"
  # Leave blank to use the first HackRF, or enter the serial shown by hackrf_info.
  serial: ""
  sample_rate: 8000000
  tune_frequency_mhz: 122.250000
  tune_offset_hz: 100000
  channel_rate_hz: 20000
  amp_enable: false
  lna_gain_db: 16
  vga_gain_db: 16
  baseband_filter_hz: 2500000
  threshold_mode: "relative"
  threshold_on_db_above_noise: 10
  threshold_off_db_above_noise: 6
  calibration_seconds: 2
  min_click_gap_seconds: 0.20
  min_quiet_time_seconds: 0.12

audio:
  file: "/home/user/weather_station/current.wav"
  device: "plughw:CARD=PCH,DEV=0"
  master_volume_percent: 85
  ptt_lead_seconds: 0.5
  ptt_tail_seconds: 0.3
  timeout_seconds: 45
  max_tx_seconds: 50

audio_capture:
  enabled: false
  directory: "/home/user/weather_station/radio_captures"
  live_socket: "/run/user/1000/myawos-radio-audio.sock"
  pre_roll_seconds: 0.35
  tail_seconds: 0.35
  minimum_active_seconds: 0.65
  maximum_clip_seconds: 90
  owned_aircraft_auxiliary_capture:
    enabled: false
    snapshot_database: "/home/user/weather_station/aircraft_snapshots.sqlite"
    max_age_seconds: 30
    max_distance_nm: 15
    check_interval_seconds: 2
    frequencies_mhz:
      - "122.800000"
      - "121.500000"
      - "122.900000"
      - "122.750000"
      - "123.025000"
    # Optional entries used only when auxiliary capture is enabled.
    aircraft: []
    # aircraft:
    #   - registration: "N12345"
    #     icao_hex: "A12345"

transmission:
  method: "ptt_audio"
  stop_receiver_during_tx: true
  receiver_settle_seconds: 0.5

ptt:
  method: "usb_relay"

  # Used only when method = scripts
  enable_script: "/home/user/weather_station/enablePTT.py"
  disable_script: "/home/user/weather_station/disablePTT.py"

  # Used only when method = usb_relay
  port: "auto"
  baud: 9600
  on_command_hex: "A0 01 01 A2"
  off_command_hex: "A0 01 00 A1"

logging:
  directory: "/home/user/weather_station/"
  filename_prefix: "sdr_click"

safety:
  # Source defaults are safe. Enable transmit_enabled only in the deployed
  # configuration after verifying the radio wiring, antenna, and authorization.
  transmit_enabled: false
  contained_rf_confirmed: false
