<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Current MyAWOS system wiring</title>
  <desc id="desc">Weather station and AWC data feed a Linux computer. An SDR receiver listens for clicks. The computer sends audio and dry-contact PTT through a USB relay to an aviation radio.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07192b"/><stop offset="1" stop-color="#0e3047"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#75d8ee"/></marker>
    <style>.box{fill:#102f45;stroke:#3d7186;stroke-width:2;rx:18;filter:url(#shadow)}.accent{fill:#f2b84b}.title{font:700 27px system-ui,sans-serif;fill:#fff}.sub{font:18px system-ui,sans-serif;fill:#b8ceda}.label{font:700 17px system-ui,sans-serif;fill:#75d8ee}.line{fill:none;stroke:#75d8ee;stroke-width:4;marker-end:url(#arrow)}.dash{stroke-dasharray:10 10}</style>
  </defs>
  <rect width="1400" height="660" fill="url(#sky)" rx="28"/>
  <text x="70" y="70" class="title">MyAWOS · current reference architecture</text>
  <text x="70" y="105" class="sub">Separate receive and transmit paths make each part easier to test.</text>
  <rect class="box" x="65" y="165" width="250" height="120"/><circle class="accent" cx="103" cy="205" r="13"/><text class="title" x="130" y="214">Weather station</text><text class="sub" x="102" y="252">WeatherLink Live · LAN</text>
  <rect class="box" x="65" y="365" width="250" height="120"/><path class="accent" d="M91 423h25l8-32 8 64 8-32h36" fill="none" stroke="#f2b84b" stroke-width="7" stroke-linecap="round"/><text class="title" x="190" y="417" text-anchor="middle">SDR receiver</text><text class="sub" x="190" y="455" text-anchor="middle">HackRF / Airspy · USB</text>
  <rect class="box" x="480" y="230" width="355" height="230"/><text class="title" x="657" y="285" text-anchor="middle">MyAWOS computer</text><text class="sub" x="657" y="327" text-anchor="middle">weather · AWC · audio · click logic</text><rect x="535" y="360" width="245" height="54" rx="27" fill="#143e54"/><text class="label" x="657" y="394" text-anchor="middle">safe transmit gate</text>
  <rect class="box" x="970" y="165" width="260" height="120"/><text class="title" x="1100" y="214" text-anchor="middle">USB relay</text><text class="sub" x="1100" y="252" text-anchor="middle">COM + NO dry contact</text>
  <rect class="box" x="970" y="385" width="260" height="120"/><text class="title" x="1100" y="434" text-anchor="middle">Aviation radio</text><text class="sub" x="1100" y="472" text-anchor="middle">microphone · PTT · RF</text>
  <path class="line" d="M315 225H440Q480 225 480 265"/><text class="label" x="365" y="208">observations</text>
  <path class="line" d="M315 425H480"/><text class="label" x="359" y="407">IQ samples</text>
  <path class="line" d="M835 285H970"/><text class="label" x="873" y="265">USB</text>
  <path class="line" d="M1100 285V385"/><text class="label" x="1120" y="342">PTT</text>
  <path class="line" d="M835 405H930Q970 405 970 445"/><text class="label" x="855" y="388">audio</text>
  <path class="line dash" d="M657 230V150Q657 130 690 130H835"/><text class="label" x="685" y="117">AWC GFA · Internet</text>
  <text x="70" y="585" class="sub">PTT is disabled in the public configuration. Verify wiring, audio level, frequency, and authorization before enabling an installed transmitter.</text>
</svg>
